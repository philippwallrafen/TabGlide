name: Opinionated PR title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  valid-pr-title:
    name: valid-pr-title
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"]

          pattern = re.compile(
              r"^(feat|fix|perf|refactor|docs|test|build|ci|chore)"
              r"(\([^():\r\n]+\))?"
              r"!?: "
              r"\S(?:.*\S)?$"
          )

          match = pattern.fullmatch(title)

          if not match:
              print(f"Invalid PR title: {title!r}")
              print()
              print("Expected:")
              print("  feat: add feature")
              print("  fix(api): handle timeout")
              print("  feat(api)!: remove legacy endpoint")
              sys.exit(1)

          scope = match.group(2)

          if scope is not None:
              scope = scope[1:-1]

              if scope.strip() != scope:
                  print("Scope must not have leading/trailing whitespace")
                  sys.exit(1)

          print(f"Valid PR title: {title}")
          PY